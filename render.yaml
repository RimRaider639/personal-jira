# Render Blueprint for Personal Kanban Board Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: kanban-api
    runtime: node
    region: oregon # Free tier available in Oregon
    plan: free
    buildCommand: npm ci && npm run build -w @kanban/backend
    startCommand: npm run start -w @kanban/backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # Set manually in Render dashboard
      - key: CLOUDINARY_API_KEY
        sync: false # Set manually in Render dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false # Set manually in Render dashboard
      - key: CORS_ORIGIN
        sync: false # Set to your Vercel frontend URL
