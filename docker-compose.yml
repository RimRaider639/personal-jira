# Docker Compose for Personal Kanban Board Development Environment
# This provides MongoDB and MinIO for local development
# Production uses MongoDB Atlas and Cloudinary

services:
  mongodb:
    image: mongo:7
    container_name: kanban-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: kanban
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kanban-network

  minio:
    image: minio/minio:latest
    container_name: kanban-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # API port
      - "9001:9001"   # Console port
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kanban-network

  # MinIO client for bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: kanban-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      mc mb myminio/kanban-attachments --ignore-existing;
      mc anonymous set download myminio/kanban-attachments;
      echo 'MinIO bucket initialized successfully';
      exit 0;
      "
    networks:
      - kanban-network

volumes:
  mongodb_data:
    driver: local
  minio_data:
    driver: local

networks:
  kanban-network:
    driver: bridge
